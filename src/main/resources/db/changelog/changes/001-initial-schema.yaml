databaseChangeLog:
  - changeSet:
      id: 001-create-currency-rates-table
      author: Ruslan
      changes:
        - createTable:
            tableName: currency_rates
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: currency_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: currency_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: exchange_rate
                  type: NUMERIC(10,4)
                  constraints:
                    nullable: false
              - column:
                  name: rate_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_currency_code_date
            tableName: currency_rates
            columns:
              - column:
                  name: currency_code
              - column:
                  name: rate_date
            unique: true

        - createIndex:
            indexName: idx_rate_date
            tableName: currency_rates
            columns:
              - column:
                  name: rate_date